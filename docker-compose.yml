name: decampoacampo

services:
  mysql:
    image: mysql:8.0
    container_name: decampoacampo_mysql
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - ./docker/mysql/mysql.env

  php:
    build: .
    container_name: decampoacampo_php
    ports:
      - "8080:80"
    depends_on:
      - mysql
    environment:
      PRECIO_USD: ${PRECIO_USD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
