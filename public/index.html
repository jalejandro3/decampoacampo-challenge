<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deCampoaCampo Challenge</title>
</head>
<body>
<header>
    <h1>De Campo a Campo - Inventario de Productos</h1>
</header>

<main>
    <h1>Listado de Productos</h1>

    <div id="mensaje" role="status" aria-live="polite" hidden></div>

    <button id="btn-nuevo" type="button">Nuevo producto</button>

    <form id="form-producto" hidden novalidate>
        <h2 id="titulo-form">Nuevo producto</h2>

        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre">
            <span class="error" id="error-nombre"></span>
        </div>

        <div>
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion">
            <span class="error" id="error-descripcion"></span>
        </div>

        <div>
            <label for="precio">Precio (ARS)</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0">
            <span class="error" id="error-precio"></span>
        </div>

        <button type="submit" id="btn-guardar">Guardar</button>
        <button type="button" id="btn-cancelar">Cancelar</button>
    </form>

    <p id="cargando">Cargando productos...</p>

    <table id="tabla-productos" hidden>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio (ARS)</th>
            <th>Precio (USD)</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
    </table>

    <p id="sin-productos" hidden>No hay productos cargados.</p>
</main>
<script type="module" src="js/app.js"></script>
<footer>
    <p>&copy; 2026 deCampoaCampo - José Alvarez</p>
</footer>
</body>
</html>
