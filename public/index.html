<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deCampoaCampo Challenge</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <div class="header__titulo">
        <h1>deCampoaCampo</h1>
    </div>
</header>

<main>
    <div class="listado__titulo">
        <h1>Listado de Productos</h1>
    </div>

    <div id="mensaje" role="status" aria-live="polite" hidden></div>

    <form id="form-producto" class="formulario-producto" hidden novalidate>
        <h2 id="titulo-form" class="formulario-producto__titulo">Nuevo producto</h2>
        <div class="formulario-producto__campos">
            <div class="formulario-producto__campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">
                <span class="error" id="error-nombre"></span>
            </div>
            <div class="formulario-producto__campo">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion">
                <span class="error" id="error-descripcion"></span>
            </div>
            <div class="formulario-producto__campo">
                <label for="precio">Precio (ARS)</label>
                <input type="number" id="precio" name="precio" step="0.01" min="0">
                <span class="error" id="error-precio"></span>
            </div>
        </div>
        <div class="formulario-producto__botones">
            <button type="submit" id="btn-guardar" class="boton boton--primario">Guardar</button>
            <button type="button" id="btn-cancelar" class="boton">Cancelar</button>
        </div>
    </form>

    <p id="cargando">Cargando productos...</p>

    <div class="tabla-productos__barra">
        <button id="btn-nuevo" class="boton boton--primario" type="button">Nuevo producto</button>
    </div>

    <table id="tabla-productos" class="tabla-productos" hidden>
        <thead>
        <tr class="tabla-productos__fila">
            <th class="tabla-productos__cabecera">Nombre</th>
            <th class="tabla-productos__cabecera">Descripción</th>
            <th class="tabla-productos__cabecera">Precio (ARS)</th>
            <th class="tabla-productos__cabecera">Precio (USD)</th>
            <th class="tabla-productos__cabecera"></th>
        </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
    </table>

    <div class="tabla-productos__barra">
        <p id="sin-productos" hidden>No hay productos cargados.</p>
    </div>


    <dialog id="modal-eliminar">
        <form method="dialog">
            <p id="texto-confirmar"></p>
            <button value="cancelar" autofocus class="boton">Cancelar</button>
            <button value="confirmar" class="boton boton--peligro">Eliminar</button>
        </form>
    </dialog>
</main>
<script type="module" src="js/app.js"></script>
<footer>
    <p>&copy; 2026 deCampoaCampo - José Alvarez</p>
</footer>
</body>
</html>
